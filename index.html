<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>莉莉絲 — 聊天介面</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Google+Sans+Text:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#131314" />

  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-size: 16px; }
body {
  font-family: 'Google Sans Text', 'Google Sans', sans-serif;
  background: #131314;
  color: #e8eaed;
  overflow: hidden;
}
#app { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: #131314; }
.sidebar {
  display: flex; flex-direction: column; height: 100%; flex-shrink: 0;
  background: #131314; overflow: hidden;
  transition: width 0.3s ease-in-out;
}
.sidebar.open { width: 260px; border-right: 1px solid rgba(255,255,255,0.06); }
.sidebar.closed { width: 0; border-right: none; }
.sidebar-inner { width: 260px; min-width: 260px; display: flex; flex-direction: column; height: 100%; }
.toggle-btn {
  position: absolute; z-index: 20; top: 20px;
  display: flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%;
  background: #28282a; border: 1px solid rgba(255,255,255,0.1);
  color: #9aa0a6; cursor: pointer; transition: left 0.3s ease, color 0.15s;
}
.toggle-btn:hover { color: #e8eaed; }
.toggle-btn.open { left: 248px; }
.toggle-btn.closed { left: 12px; }
.main-content {
  flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden;
  background: #1c1c1e;
}
.sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 12px; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand-icon {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #4285f4, #9c27b0, #e91e63);
  display: flex; align-items: center; justify-content: center;
}
.brand-name { color: #e8eaed; font-weight: 600; font-size: 16px; font-family: 'Google Sans', sans-serif; }
.new-chat-wrap { padding: 0 12px; margin-bottom: 16px; }
.btn-new-chat {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 10px 16px; border-radius: 999px; border: none;
  font-size: 14px; font-weight: 500; color: #e8eaed;
  background: #28282a; cursor: pointer; transition: background 0.15s;
  font-family: inherit;
}
.btn-new-chat:hover { background: #3c3c3e; }
.search-wrap { padding: 0 12px; margin-bottom: 8px; }
.search-box {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 999px; background: #28282a;
}
.search-box input {
  background: transparent; border: none; outline: none; flex: 1; min-width: 0;
  font-size: 14px; color: #e8eaed; font-family: inherit;
}
.search-box input::placeholder { color: #9aa0a6; }
.conv-list { flex: 1; overflow-y: auto; padding: 4px 12px; scrollbar-width: none; }
.conv-date { font-size: 12px; font-weight: 500; padding: 0 8px; margin-bottom: 4px; color: #9aa0a6; }
.conv-item { position: relative; }
.conv-item + .conv-item { margin-top: 2px; }
.btn-conv {
  width: 100%; text-align: left; padding: 8px 12px; border-radius: 12px;
  border: none; cursor: pointer; transition: background 0.1s;
  display: flex; flex-direction: column; gap: 2px; font-family: inherit;
}
.btn-conv-title { font-size: 14px; font-weight: 500; color: #e8eaed; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-conv-preview { font-size: 12px; color: #9aa0a6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-conv-active { background: #2e2e30; }
.btn-conv-hover { background: #1e1e20; }
.btn-conv:not(.btn-conv-active):not(.btn-conv-hover) { background: transparent; }
.btn-delete-conv {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  padding: 6px; border-radius: 8px; border: none; cursor: pointer;
  background: transparent; color: #9aa0a6; transition: color 0.15s; display: none;
}
.conv-item:hover .btn-delete-conv { display: block; }
.btn-delete-conv:hover { color: #f28b82; }
.sidebar-bottom { padding: 16px 12px; border-top: 1px solid rgba(255,255,255,0.06); }
.btn-settings {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 10px 12px; border-radius: 12px; border: none;
  font-size: 14px; color: #9aa0a6; cursor: pointer; transition: all 0.15s;
  background: transparent; font-family: inherit;
}
.btn-settings:hover { background: #1e1e20; color: #e8eaed; }
.chat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0;
}
.chat-title { font-size: 14px; font-weight: 500; color: #e8eaed; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
.btn-more {
  padding: 8px; border-radius: 50%; border: none; cursor: pointer;
  color: #9aa0a6; background: transparent; transition: background 0.15s;
  display: flex;
}
.btn-more:hover { background: #28282a; }
.chat-header-btns { display: flex; gap: 2px; }
.messages-area {
  flex: 1; overflow-y: auto; padding: 24px 16px; scrollbar-width: none;
}
@media (min-width: 768px) { .messages-area { padding-left: 24px; padding-right: 24px; } }
@media (min-width: 1024px) { .messages-area { padding-left: 40px; padding-right: 40px; } }
.messages-area .space-y-6 > * + * { margin-top: 24px; }
.msg-row { display: flex; gap: 12px; }
.msg-row-user { justify-content: flex-end; }
.msg-row-ai { justify-content: flex-start; }
.msg-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #4285f4, #9c27b0, #e91e63);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 2px;
}
.msg-bubble { max-width: 75%; }
.msg-bubble-user { max-width: 60%; }
.msg-bubble-ai { max-width: 100%; }
.msg-text-user {
  background: #2e2e30; border-radius: 16px; border-top-right-radius: 4px;
  padding: 12px 16px; color: #e8eaed; font-size: 14px; line-height: 1.6;
}
.msg-text-ai {
  color: #e8eaed; font-size: 14px; line-height: 1.6; white-space: pre-wrap;
}
.msg-text-ai strong { font-weight: 600; color: #e8eaed; }
.msg-text-ai pre {
  background: #1a1a1c; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 16px; margin: 8px 0;
  overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #e8eaed;
}
.msg-text-ai code { font-family: 'JetBrains Mono', monospace; }
.typing-row { display: flex; gap: 12px; align-items: flex-start; }
.typing-dots { display: flex; align-items: center; gap: 3px; padding: 8px 4px; }
.typing-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #8ab4f8;
  animation: bounce 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.15s; }
.typing-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}
.welcome {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 0 24px; padding-bottom: 120px;
}
.welcome-icon {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, #4285f4, #9c27b0, #e91e63);
  display: flex; align-items: center; justify-content: center; margin-bottom: 24px;
}
.welcome h1 {
  font-size: 30px; font-weight: 600; color: #e8eaed; margin-bottom: 8px;
  font-family: 'Google Sans', sans-serif;
}
.welcome p { color: #9aa0a6; font-size: 16px; margin-bottom: 40px; }
.suggestions {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 512px;
}
.btn-suggest {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06);
  text-align: left; font-size: 14px; color: #e8eaed; background: #28282a;
  cursor: pointer; transition: background 0.15s; font-family: inherit;
}
.btn-suggest:hover { background: #3c3c3e; }
.suggest-icon { color: #8ab4f8; flex-shrink: 0; width: 17px; display: flex; align-items: center; }
.input-wrap { flex-shrink: 0; padding: 0 16px 24px; }
@media (min-width: 768px) { .input-wrap { padding-left: 24px; padding-right: 24px; } }
@media (min-width: 1024px) { .input-wrap { padding-left: 40px; padding-right: 40px; } }
.input-container {
  display: flex; flex-direction: column; border-radius: 24px; overflow: hidden;
  background: #28282a; border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 2px 24px rgba(0,0,0,0.4); transition: box-shadow 0.2s;
}
.input-container:focus-within { box-shadow: 0 2px 28px rgba(0,0,0,0.5); }
.input-textarea {
  width: 100%; background: transparent; border: none; outline: none; resize: none;
  padding: 16px 20px 8px; font-size: 14px; line-height: 1.6;
  color: #e8eaed; font-family: 'Google Sans Text', sans-serif;
  scrollbar-width: none;
}
.input-textarea::placeholder { color: #5f6368; }
.input-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px 12px;
}
.input-toolbar-left, .input-toolbar-right { display: flex; align-items: center; gap: 4px; }
.btn-toolbar {
  padding: 10px; border-radius: 50%; border: none; cursor: pointer;
  color: #9aa0a6; background: transparent; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.btn-toolbar:hover { background: #3c3c3e; color: #e8eaed; }
.btn-send {
  width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.btn-send.active { background: #8ab4f8; color: #1c1c1e; }
.btn-send.inactive { background: #3c3c3e; color: #9aa0a6; }
.btn-send:disabled { opacity: 0.3; cursor: default; }
.theme-btn {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 10px 12px; border-radius: 12px; border: none;
  font-size: 14px; color: #9aa0a6; cursor: pointer; transition: all 0.15s;
  background: transparent; font-family: inherit;
}
.theme-btn:hover { background: #1e1e20; color: #e8eaed; }
.hidden { display: none !important; }
::-webkit-scrollbar { width: 0px; height: 0px; }

body.light .btn-more:hover { background: #e8eaed; }

.settings-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); z-index: 100;
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.settings-overlay.open { display: flex; }
.settings-panel {
  background: #28282a; border-radius: 20px; width: 440px; max-width: 90vw;
  max-height: 85vh; overflow-y: auto; box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.08);
}
.settings-header {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 24px 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.settings-header h2 { font-size: 18px; font-weight: 600; flex: 1; }
.settings-header-icon {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #4285f4, #9c27b0);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.settings-close {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: transparent; color: #9aa0a6; cursor: pointer;
  font-size: 24px; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.settings-close:hover { background: rgba(255,255,255,0.08); color: #e8eaed; }
.settings-body { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; }
.settings-group { display: flex; flex-direction: column; gap: 6px; }
.settings-group label { font-size: 13px; font-weight: 500; color: #9aa0a6; }
.settings-group input[type="text"],
.settings-group input[type="password"],
.settings-group select {
  padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
  background: #1c1c1e; color: #e8eaed; font-size: 14px; font-family: inherit;
  outline: none; transition: border-color 0.15s;
}
.settings-group input:focus,
.settings-group select:focus { border-color: #8ab4f8; }
.settings-group select { cursor: pointer; }
.mode-toggle-row {
  display: flex; align-items: center; gap: 12px; margin: 4px 0;
}
.mode-label { font-size: 13px; color: #9aa0a6; }
.mode-label.normal-label { color: #8ab4f8; }
.mode-label.writing-label { color: #fdd663; }
.toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
  background: #3c3c3e; border-radius: 24px; transition: 0.3s;
}
.toggle-slider::before {
  content: ''; position: absolute; height: 18px; width: 18px;
  left: 3px; bottom: 3px; background: #9aa0a6; border-radius: 50%; transition: 0.3s;
}
.toggle-switch input:checked + .toggle-slider { background: #8ab4f8; }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); background: #1c1c1e; }
.mode-badge {
  display: inline-flex; align-items: center; gap: 6px; width: fit-content;
  padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
}
.mode-badge.normal { background: rgba(138,180,248,0.15); color: #8ab4f8; }
.mode-badge.writing { background: rgba(253,214,99,0.15); color: #fdd663; }
.settings-save-btn {
  padding: 12px 20px; border-radius: 12px; border: none;
  background: #8ab4f8; color: #1c1c1e; font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: background 0.15s; margin-top: 4px;
}
.settings-save-btn:hover { background: #aecbfa; }
.settings-sync-btn {
  padding: 6px 16px; border-radius: 10px; border: none;
  background: #34a853; color: #ffffff; font-size: 13px; font-weight: 500;
  cursor: pointer; font-family: inherit; transition: background 0.15s;
}
.settings-sync-btn:hover { background: #3cba5e; }
.settings-status { font-size: 13px; color: #81c995; text-align: center; min-height: 20px; }
body.light .settings-overlay { background: rgba(0,0,0,0.2); }
body.light .settings-panel { background: #ffffff; border-color: rgba(0,0,0,0.08); }
body.light .settings-header { border-bottom-color: rgba(0,0,0,0.08); }

.import-overlay {

  background: rgba(0,0,0,0.6); z-index: 110;
  display: none; align-items: center; justify-content: center;

}
.import-overlay.open { display: flex; }
.import-panel {

}
.import-header {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 24px 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.import-header h2 { font-size: 18px; font-weight: 600; flex: 1; }
.import-header-icon {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #34a853, #1a73e8);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.import-close {

.import-desc { font-size: 13px; color: #9aa0a6; line-height: 1.6; }
.import-desc code {
  background: #1c1c1e; padding: 2px 8px; border-radius: 6px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #fdd663;

.import-textarea {
  width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
  background: #1c1c1e; color: #e8eaed; font-size: 13px; font-family: 'JetBrains Mono', monospace;
  outline: none; resize: vertical; min-height: 160px;

function triggerImageUpload() {
  document.getElementById('imageUploadInput').click();
}

function handleImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    pendingImage = { dataUrl: ev.target.result, fileName: file.name };
    if (getActiveConv()) updateInputBarOnly(); else renderMain();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function removeImage() {
  pendingImage = null;
  if (getActiveConv()) updateInputBarOnly(); else renderMain();
}

function getActiveConv() {
  return conversations.find(c => c.id === activeId && !c.deleted) || null;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function fixSelfReference(text) {
  return text.replace(/\u8389\u8389\u7d72/g, '\u6211');
}

function scrollToBottom(force = false) {
  const area = document.getElementById('messagesArea');
  if (!area) return;
  const distFromBottom = area.scrollHeight - area.scrollTop - area.clientHeight;
  if (force || distFromBottom < 150) area.scrollTop = area.scrollHeight;
}

function saveData() {
  localStorage.setItem('lilith_chat_data', JSON.stringify({
    conversations, activeId, writingMode, apiKey, baseUrl, model, gasUrl,
    currentView, currentTopicId
  }));
}

// ── Topics 資料模型 ──
function saveTopics() {
  localStorage.setItem(TOPICS_KEY, JSON.stringify(topics));
}

function loadTopics() {
  try {
    const raw = localStorage.getItem(TOPICS_KEY);
    topics = raw ? JSON.parse(raw) : [];
  } catch (e) { topics = []; }
}

function getTopic(id) {
  return topics.find(t => t.id === id) || null;
}

function getOrCreateTopic(name, emoji) {
  if (!name || !name.trim()) return null;
  let topic = topics.find(t => t.name === name.trim());
  if (!topic) {
    topic = {
      id: Date.now().toString() + '_' + Math.random().toString(36).slice(2, 6),
      name: name.trim(),
      emoji: emoji || '💬',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    topics.push(topic);
    saveTopics();
  }
  return topic;
}

function deleteTopic(id, e) {
  if (e) e.stopPropagation();
  if (!confirm('刪除主題「' + (getTopic(id)?.name || '') + '」？所有訊息仍會保留，僅取消主題分類。')) return;
  topics = topics.filter(t => t.id !== id);
  conversations = conversations.map(c => ({
    ...c,
    messages: c.messages.map(m => m.topicId === id ? { ...m, topicId: null } : m)
  }));
  saveTopics(); saveData(); renderSidebar(); renderMain();
  if (currentTopicId === id) switchView('home', null);
}

function renameTopic(id, newName) {
  const t = topics.find(t => t.id === id);
  if (t && newName && newName.trim()) {
    t.name = newName.trim();
    t.updatedAt = new Date().toISOString();
    saveTopics(); renderSidebar(); renderMain();
  }
}

function getFilteredMessages() {
  const allMsgs = [];
  conversations.forEach(c => {
    if (!c.deleted) {
      c.messages.forEach(m => {
        allMsgs.push({ ...m, convId: c.id, convTitle: c.title });
      });
    }
  });
  let filtered = allMsgs;
  // 依 view 過濾 topic
  if (currentView === 'topic' && currentTopicId) {
    filtered = filtered.filter(m => m.topicId === currentTopicId);
  }
  // 依搜尋文字過濾內容
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(m => {
      const text = typeof m.content === 'string' ? m.content : JSON.stringify(m.content);
      return text.toLowerCase().includes(q);
    });
  }
  return filtered;
}

function getTopicName(id) {
  const t = topics.find(t => t.id === id);
  return t ? (t.emoji + ' ' + t.name) : '全部訊息';
}

function switchView(view, topicId) {
  currentView = view;
  currentTopicId = topicId || null;
  activeId = null;
  window._inputValue = '';
  renderSidebar(); renderMain();
}

function selectTopic(id) {
  switchView('topic', id);
}

function goHome() {
  switchView('home', null);
}

function loadData() {
  const saved = localStorage.getItem('lilith_chat_data');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      conversations = data.conversations || [];
      activeId = data.activeId || null;
      writingMode = data.writingMode || false;
      apiKey = data.apiKey || '';
      baseUrl = data.baseUrl || 'https://apihub.agnes-ai.com/v1';
      model = data.model || 'agnes-2.0-flash';
      gasUrl = data.gasUrl || '';
      if (data.currentView) currentView = data.currentView;
      if (data.currentTopicId) currentTopicId = data.currentTopicId;
      // 如果儲存的是 topic view 但該 topic 已不存在，退回 home
      if (currentView === 'topic' && currentTopicId) {
        const stillExists = topics.some(t => t.id === currentTopicId);
        if (!stillExists) { currentView = 'home'; currentTopicId = null; }
      }
    } catch (e) { console.warn('\u8cc7\u6599\u8f09\u5165\u5931\u6557', e); }
  }
  loadTopics();
  conversations = conversations.map(c => {
    const { synced, ...rest } = c;
    return { ...rest, updatedAt: c.updatedAt || (synced ? new Date(c.date || Date.now()).toISOString() : new Date().toISOString()), deleted: c.deleted || false };
  });
  // GAS 環境：自動偵測同步網址 + 從後端擷取 API Key 等設定
  if (isGAS()) {
    if (!gasUrl) {
      gasUrl = window.location.origin + window.location.pathname.replace(/\/+$/, '');
    }
    google.script.run
      .withSuccessHandler(cfg => {
        if (cfg.apiKey) { apiKey = cfg.apiKey; }
        if (cfg.baseUrl) { baseUrl = cfg.baseUrl; }
        if (cfg.model)   { model   = cfg.model; }
        // 將後端配置回存 localStorage，加速下一次載入
        saveData();
      })
      .withFailureHandler(() => {})
      .getConfig();
  }
  if (gasUrl) setTimeout(pullFromGAS, 300);
}

// ── 雲端同步 ──
function stripConversationImages(conv) {
  return { ...conv, messages: conv.messages.map(msg => {
    if (Array.isArray(msg.content)) {
      const textPart = msg.content.find(p => p.type === 'text');
      return { ...msg, content: textPart ? textPart.text : '\ud83d\udcf7 [\u5716\u7247]' };
    }
    return msg;
  })};
}

/** 是否執行在 GAS HtmlService 環境（有 google.script.run 可用） */
function isGAS() {
  return typeof google !== 'undefined' && google.script && google.script.run;
}

function pullFromGAS() {
  // GAS 環境可直接用內部通道（不需 gasUrl），否則需要 URL
  if (!isGAS() && !gasUrl) return;
  const since = localStorage.getItem('lilith_lastSyncAt') || '';

  if (isGAS()) {
    // GAS 內部通道：直接呼叫後端，無 HTTP 轉向問題
    google.script.run
      .withSuccessHandler(data => {
        const incoming = data.conversations;
        if (Array.isArray(incoming) && incoming.length > 0) {
          processPullData(incoming, data.serverNow);
        }
      })
      .withFailureHandler(() => {})
      .handleSyncPull(since);
    // 同時拉取 topics
    google.script.run
      .withSuccessHandler(data => {
        if (Array.isArray(data.topics) && data.topics.length > 0) {
          processPullTopics(data.topics);
        }
      })
      .withFailureHandler(() => {})
      .handleSyncPullTopics();
    return;
  }

  // Fallback: fetch（本地執行或非 GAS 環境）
  const url = gasUrl + '?since=' + encodeURIComponent(since);
  fetch(url).then(r => r.json()).then(data => {
    processPullData(data.conversations, data.serverNow);
  }).catch(() => {});
  // 同時拉取 topics
  fetch(gasUrl + '?topicssync=1').then(r => r.json()).then(data => {
    if (Array.isArray(data.topics) && data.topics.length > 0) {
      processPullTopics(data.topics);
    }
  }).catch(() => {});
}

function processPullData(incoming, serverNow) {
  if (!Array.isArray(incoming) || incoming.length === 0) return;
  const localMap = new Map(conversations.map(c => [c.id, c]));
  let changed = false;
  incoming.forEach(remote => {
    const local = localMap.get(remote.id);
    if (!local) { conversations.push(remote); localMap.set(remote.id, remote); changed = true; }
    else if (remote.deleted) { conversations = conversations.filter(c => c.id !== remote.id); if (activeId === remote.id) activeId = null; localMap.delete(remote.id); changed = true; }
    else if (remote.updatedAt > local.updatedAt) { Object.assign(local, remote); changed = true; }
  });
  if (changed) { saveData(); renderSidebar(); renderMain(); }
  // 以 max(serverNow, 資料中最大的 updatedAt) 做為下次拉取的 since，
  // 避免瀏覽器與 GAS 伺服器時鐘偏移導致資料遺失
  if (serverNow) {
    const maxUpdatedAt = incoming.reduce((max, c) => c.updatedAt > max ? c.updatedAt : max, '');
    const syncMarker = maxUpdatedAt > serverNow ? maxUpdatedAt : serverNow;
    localStorage.setItem('lilith_lastSyncAt', syncMarker);
  }
}

function processPullTopics(incoming) {
  if (!Array.isArray(incoming) || incoming.length === 0) return;
  const localMap = new Map(topics.map(t => [t.id, t]));
  let changed = false;
  incoming.forEach(remote => {
    const local = localMap.get(remote.id);
    if (!local) { topics.push(remote); localMap.set(remote.id, remote); changed = true; }
    else if (remote.updatedAt > local.updatedAt) { Object.assign(local, remote); changed = true; }
  });
  if (changed) { saveTopics(); renderSidebar(); }
}

function pushToGAS() {
  // GAS 環境可直接用內部通道（不需 gasUrl），否則需要 URL + 連線
  if (!isGAS() && (!gasUrl || !navigator.onLine)) return;
  const cleanConvs = conversations.map(stripConversationImages);

  if (isGAS()) {
    // GAS 內部通道：直接呼叫後端，無 HTTP 轉向問題
    google.script.run
      .withSuccessHandler(res => {
        if (res.ok && res.serverNow) {
          const maxLocal = cleanConvs.reduce((max, c) => c.updatedAt > max ? c.updatedAt : max, '');
          const syncMarker = maxLocal > res.serverNow ? maxLocal : res.serverNow;
          localStorage.setItem('lilith_lastSyncAt', syncMarker);
        }
      })
      .withFailureHandler(() => {})
      .handleSyncPush(cleanConvs);
    // 同時推送 topics
    google.script.run
      .withSuccessHandler(res => {
        if (res.ok) updateSyncStatus('\u2713 \u5df2\u540c\u6b65');
      })
      .withFailureHandler(() => updateSyncStatus('\u2717 \u540c\u6b65\u5931\u6557'))
      .handleSyncPushTopics(topics);
    return;
  }

  // Fallback: fetch（本地執行或非 GAS 環境）
  const postUrl = gasUrl + (gasUrl.includes('?') ? '&' : '?');
  fetch(postUrl, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ conversations: cleanConvs, topics: topics })
  }).then(r => r.json()).then(res => {
    if (res.ok && res.serverNow) {
      const maxLocal = cleanConvs.reduce((max, c) => c.updatedAt > max ? c.updatedAt : max, '');
      const syncMarker = maxLocal > res.serverNow ? maxLocal : res.serverNow;
      localStorage.setItem('lilith_lastSyncAt', syncMarker);
      updateSyncStatus('\u2713 \u5df2\u540c\u6b65');
    }
    else { updateSyncStatus('\u2717 \u540c\u6b65\u5931\u6557'); }
  }).catch(() => updateSyncStatus('\u2717 \u540c\u6b65\u5931\u6557'));
}

function syncMemoryNow() {
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = '\u23f3 \u540c\u6b65\u4e2d\u2026';
  // 先推後拉，確保雙向同步
  pushToGAS();
  pullFromGAS();
}

function updateSyncStatus(msg) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = msg;
  setTimeout(() => { if (el && el.textContent === msg) el.textContent = ''; }, 3000);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (isGAS() || (gasUrl && navigator.onLine))) pushToGAS();
});

// ── 設定面板 ──
function openSettings() {
  document.getElementById('apiKeyInput').value = apiKey;
  document.getElementById('modelSelect').value = model;
  document.getElementById('baseUrlInput').value = baseUrl;
  document.getElementById('writingModeToggle').checked = writingMode;
  document.getElementById('gasUrlInput').value = gasUrl;
  document.getElementById('settingsOverlay').classList.add('open');
  updateModeBadge();
  // GAS 環境顯示自動設定狀態
  const apiKeyStatus = document.getElementById('apiKeyStatus');
  const gasUrlStatus = document.getElementById('gasUrlStatus');
  if (apiKeyStatus && isGAS()) {
    apiKeyStatus.textContent = apiKey ? '\u2705 \u5f9e GAS \u5f8c\u7aef\u81ea\u52d5\u8a2d\u5b9a' : '\u23f3 \u5f9e GAS \u5f8c\u7aef\u52a0\u8f09\u4e2d\u2026';
    apiKeyStatus.style.display = '';
  } else if (apiKeyStatus) {
    apiKeyStatus.style.display = 'none';
  }
  if (gasUrlStatus && isGAS() && gasUrl) {
    gasUrlStatus.textContent = '\u2705 \u81ea\u52d5\u5075\u6e2c\u90e8\u7f72\u7db2\u5740';
    gasUrlStatus.style.display = '';
  } else if (gasUrlStatus) {
    gasUrlStatus.style.display = 'none';
  }
}

function closeSettings(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('settingsOverlay').classList.remove('open');
}

function updateModeBadge() {
  const badge = document.getElementById('modeBadge');
  if (writingMode) { badge.className = 'mode-badge writing'; badge.textContent = '\u5beb\u4f5c\u6a21\u5f0f'; }
  else { badge.className = 'mode-badge normal'; badge.textContent = '\u4e00\u822c\u6a21\u5f0f'; }
}

function toggleWritingMode() {
  writingMode = document.getElementById('writingModeToggle').checked;
  updateModeBadge();
}

function saveSettings() {
  apiKey = document.getElementById('apiKeyInput').value.trim();
  model = document.getElementById('modelSelect').value;
  baseUrl = document.getElementById('baseUrlInput').value.trim().replace(/\/+$/, '');
  writingMode = document.getElementById('writingModeToggle').checked;
  gasUrl = document.getElementById('gasUrlInput').value.trim();
  saveData();
  // 儲存 URL 後立即拉取遠端資料
  if (gasUrl) setTimeout(pullFromGAS, 300);
  const status = document.getElementById('settingsStatus');
  status.textContent = '\u2713 \u8a2d\u5b9a\u5df2\u5132\u5b58';
  setTimeout(() => { status.textContent = ''; }, 2000);
}

// ── 匯入對話 ──
function openImport() {
  document.getElementById('importOverlay').classList.add('open');
  document.getElementById('importTextarea').value = '';
  document.getElementById('importError').textContent = '';
}

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('importTextarea').value = e.target.result;
    document.getElementById('importError').textContent = '\u2713 \u5df2\u8f09\u5165\uff1a' + file.name;
    document.getElementById('importError').style.color = '#81c995';
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = '';
}

function closeImport(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('importOverlay').classList.remove('open');
}

function doImport() {
  const raw = document.getElementById('importTextarea').value.trim();
  const errorEl = document.getElementById('importError');
  errorEl.style.color = '';
  if (!raw) { errorEl.textContent = '\u8acb\u5148\u8cbc\u4e0a JSON \u5167\u5bb9\u6216\u9078\u64c7\u6a94\u6848'; return; }
  try {
    const data = JSON.parse(raw);
    if (data === null || typeof data !== 'object') { errorEl.textContent = 'JSON \u683c\u5f0f\u932f\u8aa4\uff1a\u6700\u5916\u5c64\u5fc5\u9808\u662f\u7269\u4ef6\uff08{}\uff09\u6216\u9663\u5217\uff08[]\uff09\u3002'; return; }
    let importedChats = [];
    if (data.chats && Array.isArray(data.chats)) importedChats = data.chats;
    else if (Array.isArray(data)) importedChats = data;
    else if (data.messages) importedChats = [{ id: Date.now().toString(), title: '\u5f59\u5165\u7684\u5c0d\u8a71', messages: data.messages, date: '\u4eca\u5929' }];
    else { errorEl.textContent = '\u7121\u6cd5\u8fa8\u8b58 JSON \u683c\u5f0f\u3002\u652f\u63f4 lilith_pro_state\u3001\u5c0d\u8a71\u9663\u5217\u3001\u55ae\u4e00\u5c0d\u8a71\u3002'; return; }
    const existingIds = new Set(conversations.map(c => c.id));
    let validCount = 0;
    importedChats.forEach(chat => {
      if (!chat.messages || !Array.isArray(chat.messages) || !chat.messages.length) return;
      if (existingIds.has(chat.id)) return;
      conversations.push({
        id: chat.id || Date.now().toString(),
        title: chat.title || chat.messages[0].content.slice(0, 20) || '\u5f59\u5165\u7684\u5c0d\u8a71',
        preview: chat.messages[0].content.slice(0, 50) || '',
        date: chat.date || '\u6b77\u53f2',
        updatedAt: new Date().toISOString(),
        deleted: false,
        messages: chat.messages
      });
      existingIds.add(chat.id);
      validCount++;
    });
    if (validCount === 0) { errorEl.textContent = '\u7121\u65b0\u8cc7\u6599\u53ef\u5f59\u5165\u3002'; return; }
    saveData(); renderSidebar(); renderMain();
    document.getElementById('importOverlay').classList.remove('open');
  } catch (e) {
    errorEl.textContent = 'JSON \u89e3\u6790\u5931\u6557\uff1a' + e.message;
  }
}

// ── 檔案下載 ──
function downloadAsBlob(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadAsMd(content, filename) { downloadAsBlob(content, filename, 'text/markdown'); }
function downloadAsJson(data, filename) { downloadAsBlob(JSON.stringify(data, null, 2), filename, 'application/json'); }

function downloadMessage(msgId) {
  const conv = getActiveConv();
  if (!conv) return;
  const msg = conv.messages.find(m => m.id === msgId);
  if (!msg) return;
  let content = msg.content;
  if (msg.role === 'assistant') content = content.replace(/^[(\u5bb3\u7f9e|\u751f\u6c23|\u96e3\u904e|\u9a5a\u8a1d)]\s*/, '');
  const safeTitle = conv.title.replace(/[^a-zA-Z0-9\u4e00-\u9fff_-]/g, '_').slice(0, 30);
  downloadAsMd(content, '\u8389\u8389\u7d72_' + safeTitle + '.md');
}

function downloadConversation() {
  const conv = getActiveConv();
  if (!conv) return;
  const safeTitle = conv.title.replace(/[^a-zA-Z0-9\u4e00-\u9fff_-]/g, '_').slice(0, 30);
  downloadAsJson(conv, '\u5c0d\u8a71_' + safeTitle + '.json');
}

  html += '<p class="conv-date">主　題</p>';

  let filtered = topics;

    filtered = topics.filter(t => t.name.toLowerCase().includes(searchQuery));
  }

  filtered.sort((a, b) => (b.updatedAt || '') < (a.updatedAt || '') ? -1 : 1);

    html += '</div>';
  });

  convList.innerHTML = html || '<div style="padding:20px;text-align:center;color:#5f6368;font-size:13px">' + (searchQuery ? '無符合的主題' : '尚無主題，開始對話後 AI 會自動分類') + '</div>';

// 取得特定主題的所有訊息（輔助函式）
function getFilteredMessagesForTopic(topicId) {
  const msgs = [];
  conversations.forEach(c => {
    if (!c.deleted) {
      c.messages.forEach(m => {
        if (m.topicId === topicId) msgs.push({ ...m, convId: c.id, convTitle: c.title });
      });
    }
  });
  return msgs;
}

async function readUrl(url) {

  if (!resp.ok) throw new Error('Jina AI Reader \u932f\u8aa4 (' + resp.status + ')');
  return (await resp.text()).slice(0, 8000);

async function firecrawlSearch(query) {
  const resp = await fetch('https://api.firecrawl.dev/v2/search', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query, limit: 5 })
  });
  if (!resp.ok) throw new Error('Firecrawl \u932f\u8aa4 (' + resp.status + ')');
  return (await resp.json()).data || [];
}

function formatSearchResults(results) {
  if (!results || results.length === 0) return '\uff08\u7121\u641c\u5c0b\u7d50\u679c\uff09';
  return results.map((r, i) => (i + 1) + '. ' + (r.title || '\u7121\u6a19\u984c') + '\n   ' + (r.description || '') + '\n   ' + (r.url || '')).join('\n\n');
}

/** 段落分類用的 function calling 工具定義 */
const CLASSIFICATION_TOOLS = [{
  type: 'function',
  function: {
    name: 'classify_paragraphs',
    description: '將使用者輸入的各個段落分類到最適合的主題',
    parameters: {
      type: 'object',
      properties: {
        classifications: {
          type: 'array',
          items: {
            type: 'object',
            properties: {
              paragraph_index: { type: 'number', description: '段落索引（從 0 開始）' },
              topic_name: { type: 'string', description: '最匹配的現有主題名稱，或新主題的簡短名稱（2-5字）' },
              topic_emoji: { type: 'string', description: '適合此主題的 emoji 圖示' },
              reasoning: { type: 'string', description: '簡短說明為何歸類到此主題' }
            },
            required: ['paragraph_index', 'topic_name', 'topic_emoji']
          }
        }
      },
      required: ['classifications']
    }
  }
}];

async function sendMessage() {
  const textarea = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  if (!textarea) return;
  const content = textarea.value.trim();
  if ((!content && !pendingImage) || isSending) return;
  if (!apiKey) { openSettings(); return; }
  const wasWelcome = !getActiveConv() && !activeId && currentView === 'home';
  const userContent = pendingImage ? [{ type: 'text', text: content || ' ' }, { type: 'image_url', image_url: { url: pendingImage.dataUrl } }] : content;
  const userMsg = { id: Date.now().toString(), role: 'user', content: userContent, topicId: null };
  const userText = pendingImage ? (content || '📷 圖片') : content;
  let convId = activeId;
  if (!convId) {
    const newConv = { id: Date.now().toString(), title: userText.slice(0, 30) + (userText.length > 30 ? '...' : ''), preview: userText.slice(0, 50), date: '今天', messages: [userMsg], updatedAt: new Date().toISOString(), deleted: false };
    conversations.unshift(newConv); activeId = newConv.id; convId = newConv.id;
  } else {
    conversations = conversations.map(c => c.id === convId ? { ...c, messages: [...c.messages, userMsg], updatedAt: new Date().toISOString() } : c);
  }
  window._inputValue = ''; pendingImage = null; isTyping = true; isSending = true; sendBtn.disabled = true;
  renderSidebar(); renderMain();
  requestAnimationFrame(() => { const ta = document.getElementById('chatInput'); if (ta) ta.focus(); });
  try {
    const conv = getActiveConv();
    if (!conv) throw new Error('對話已遺失');

    // PHASE 1: 段落分類（僅純文字，非圖片）
    let classifications = [];
    let assignedTopicId = null;
    const paragraphs = content.split(/\n\s*\n/).filter(p => p.trim());

    if (paragraphs.length > 0 && !pendingImage) {
      const topicList = topics.length > 0
        ? topics.map(t => `- "${t.name}" (${t.emoji})`).join('\n')
        : '（尚無任何主題）';
      const classPrompt = currentView === 'topic' && currentTopicId
        ? `目前所在主題：「${getTopic(currentTopicId)?.name || '未知'}」。先檢查是否匹配現有主題，再決定新建。`
        : '分類到最適合的主題，若無適合則建立新主題。';

      const classResp = await fetch(baseUrl + '/chat/completions', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model,
          messages: [
            { role: 'system', content: '你是一個主題分類助手。將使用者輸入的每個段落分類到最適合的主題。\n\n現有主題列表：\n' + topicList + '\n\n分類原則：\n' + classPrompt + '\n\n如果段落明顯不屬於任何現有主題，請建立一個簡短的新主題名稱（2-5字）。\n回覆時請使用 classify_paragraphs 工具。' },
            { role: 'user', content: paragraphs.map((p, i) => `[段落 ${i}]\n${p}`).join('\n\n') }
          ],
          tools: CLASSIFICATION_TOOLS,
          tool_choice: { type: 'function', function: { name: 'classify_paragraphs' } },
          temperature: 0.3,
          max_tokens: 500
        })
      });
      if (!classResp.ok) { const errText = await classResp.text().catch(() => ''); throw new Error('分類 API 錯誤 (' + classResp.status + '): ' + errText.slice(0, 100)); }
      const classData = await classResp.json();
      const choice = classData.choices?.[0];
      if (choice?.message?.tool_calls?.[0]) {
        const args = JSON.parse(choice.message.tool_calls[0].function.arguments);
        if (args.classifications && Array.isArray(args.classifications)) {
          classifications = args.classifications.map(c => {
            let topic = getOrCreateTopic(c.topic_name, c.topic_emoji);
            return { paragraphIndex: c.paragraph_index, topicId: topic?.id || null, topicName: c.topic_name, reasoning: c.reasoning || '' };
          }).filter(c => c.topicId);
          if (classifications.length > 0) {
            assignedTopicId = classifications[0].topicId;
          }
        }
      }
      // 分類失敗時 fallback
      if (classifications.length === 0) {
        const defaultTopic = getOrCreateTopic('雜項', '📌');
        assignedTopicId = defaultTopic?.id || null;
        classifications = paragraphs.map((p, i) => ({ paragraphIndex: i, topicId: assignedTopicId, topicName: '雜項', reasoning: '' }));
      }
      saveTopics();
    }

    // 更新 user message 的 topicId
    if (assignedTopicId) {
      conversations = conversations.map(c => c.id === convId ? {
        ...c,
        messages: c.messages.map(m => m.id === userMsg.id ? { ...m, topicId: assignedTopicId } : m)
      } : c);
    }

    // PHASE 2: 生成回應
    const prompt = writingMode ? WRITING_SYSTEM_PROMPT : LILITH_SYSTEM_PROMPT;
    const apiMessages = [{ role: 'system', content: prompt }];

    // 加入分類脈絡
    if (classifications.length > 0) {
      const classContext = '使用者本次傳送的內容（共 ' + paragraphs.length + ' 段）分類結果：\n' +
        classifications.map(c => '  - 段落 ' + (c.paragraphIndex + 1) + ' → 主題「' + c.topicName + '」' + (c.reasoning ? '（' + c.reasoning + '）' : '')).join('\n') +
        '\n請根據以上分類生成回應，自然地涵蓋所有段落的內容。';
      apiMessages.push({ role: 'system', content: classContext });
    }

    // 加入對話歷史
    conv.messages.forEach(m => {
      apiMessages.push({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content });
    });

    // 外部上下文注入（URL 讀取、搜尋）
    let injectedContext = '';
    const contextPromises = [];
    const urlMatch = content.match(/https?:\/\/[^\s]+/);
    if (urlMatch) { const url = urlMatch[0]; contextPromises.push(readUrl(url).then(md => '[以下是來自 ' + url + ' 的網頁內容]\n' + md + '\n---').catch(e => '(嘗試讀取網頁 ' + url + ' 時發生錯誤：' + e.message + ')')); }
    const searchMatch = content.match(/^(幫我查|搜尋|查一下|查|search)\s+(.+)/i);
    if (searchMatch) { const query = searchMatch[2]; contextPromises.push(firecrawlSearch(query).then(results => '[以下是關於「' + query + '」的網路搜尋結果]\n' + formatSearchResults(results) + '\n---').catch(e => '(嘗試搜尋「' + query + '」時發生錯誤：' + e.message + ')')); }
    if (contextPromises.length > 0) {
      const results = await Promise.all(contextPromises);
      injectedContext = results.join('\n') + '\n請根據以上內容來回應使用者。';
      apiMessages.splice(1, 0, { role: 'system', content: injectedContext });
    }

    const resp = await fetch(baseUrl + '/chat/completions', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, messages: apiMessages, temperature: 0.8, max_tokens: 2048, stream: false })
    });
    if (!resp.ok) { const errText = await resp.text().catch(() => ''); throw new Error('API 錯誤 (' + resp.status + '): ' + errText.slice(0, 100)); }
    const data = await resp.json();
    let fullReply = data.choices?.[0]?.message?.content || '';
    if (!fullReply) throw new Error('API 回傳空內容');
    const cleanedReply = fixSelfReference(fullReply);

    conversations = conversations.map(c => c.id === convId ? { ...c, messages: [...c.messages, { id: Date.now().toString() + 1, role: 'assistant', content: cleanedReply }], updatedAt: new Date().toISOString() } : c);
  } catch (e) {
    isTyping = false;
    const errMsg = '喂…笨蛋老闆，好像出錯了（' + e.message + '）。要不要檢查一下 API Key 或網路連線？';
    conversations = conversations.map(c => c.id === convId ? { ...c, messages: [...c.messages, { id: Date.now().toString() + 1, role: 'assistant', content: errMsg }], updatedAt: new Date().toISOString() } : c);
  } finally {
    isTyping = false; isSending = false; saveData(); saveTopics(); renderSidebar();
    if (wasWelcome || !getActiveConv()) renderMain(); else updateInputBarOnly();
    requestAnimationFrame(() => { const ta = document.getElementById('chatInput'); if (ta) { ta.focus(); const len = ta.value.length; ta.setSelectionRange(len, len); } });
    pushToGAS();
  }
}

function selectConversation(id) {
  activeId = id; window._inputValue = '';
  renderSidebar(); renderMain();
  requestAnimationFrame(() => { const ta = document.getElementById('chatInput'); if (ta) ta.focus(); });
}

function newConversation() {
  currentView = 'home'; currentTopicId = null;
  activeId = null; window._inputValue = '';
  renderSidebar(); renderMain();
  requestAnimationFrame(() => { const ta = document.getElementById('chatInput'); if (ta) ta.focus(); });
  if (window.innerWidth < 768 && sidebarOpen) closeSidebarMobile();
}

function deleteConversation(id, e) {
  e.stopPropagation();
  conversations = conversations.map(c => c.id === id ? { ...c, deleted: true, updatedAt: new Date().toISOString() } : c);
  if (activeId === id) activeId = null;
  saveData(); renderSidebar(); renderMain(); pushToGAS();
}

let renaming = false;

function startRename() {
  if (renaming) return;
  renaming = true;
  const titleEl = document.querySelector('.chat-title');
  if (!titleEl) return;
  const current = titleEl.textContent;
  titleEl.innerHTML = '<input type="text" id="renameInput" class="conv-rename-input" value="' + escapeHtml(current) + '" />';
  const input = document.getElementById('renameInput');
  requestAnimationFrame(() => { input.focus(); input.select(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') finishRename(input.value); if (e.key === 'Escape') cancelRename(); });
  input.addEventListener('blur', () => finishRename(input.value));
}

function finishRename(newTitle) {
  renaming = false;
  newTitle = newTitle.trim();
  const conv = getActiveConv();
  if (conv && newTitle && newTitle !== conv.title) {
    conv.title = newTitle; conv.updatedAt = new Date().toISOString();
    saveData(); renderSidebar(); pushToGAS();
    const titleEl = document.querySelector('.chat-title');
    if (titleEl) titleEl.textContent = newTitle;
  } else { cancelRename(); }
}

function cancelRename() {
  renaming = false;
  const conv = getActiveConv();
  const titleEl = document.querySelector('.chat-title');
  if (titleEl && conv) titleEl.textContent = conv.title;
}

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  sidebar.className = 'sidebar ' + (sidebarOpen ? 'open' : 'closed');
  toggleBtn.className = 'toggle-btn ' + (sidebarOpen ? 'open' : 'closed');
  toggleBtn.innerHTML = sidebarOpen ? icons.chevronLeft : icons.chevronRight;
  const backdrop = document.getElementById('sidebarBackdrop');
  if (backdrop) backdrop.className = 'sidebar-backdrop' + (sidebarOpen ? ' open' : '');
}

function closeSidebarMobile() {
  if (window.innerWidth < 768 && sidebarOpen) {
    toggleSidebar();
  }
}

let isLight = localStorage.getItem('lilith-theme') === 'light';

function applyTheme() {
  document.body.classList.toggle('light', isLight);
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  if (isLight) {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
    label.textContent = '\u9ed1\u6697';
  } else {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    label.textContent = '\u767d\u5929';
  }
  localStorage.setItem('lilith-theme', isLight ? 'light' : 'dark');
}

function toggleTheme() { isLight = !isLight; applyTheme(); }

// ═══════════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════════

loadData();
applyTheme();

// ── PWA：註冊 Service Worker ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ── PWA：處理從其他 App 分享進來的內容 ──
(function handleSharedContent() {
  const params = new URLSearchParams(location.search);
  if (params.get('shared') === '1') {
    const sharedUrl = params.get('url') || '';
    const sharedText = params.get('text') || '';
    const sharedTitle = params.get('title') || '';
    // 組合分享內容
    let input = '';
    if (sharedUrl && sharedText && sharedText !== sharedUrl) {
      input = sharedTitle
        ? `幫我看這篇文章：${sharedTitle}\n${sharedUrl}\n\n${sharedText}`
        : `幫我看這個連結：${sharedUrl}\n\n${sharedText}`;
    } else if (sharedUrl) {
      input = `幫我看這篇文章：${sharedUrl}`;
    } else if (sharedText) {
      input = `幫我處理這段內容：${sharedText}`;
    }
    if (input) {
      window._inputValue = input;
      // 清除網址參數，避免重整後重複處理
      history.replaceState(null, '', location.pathname);
    }
  }
})();

const searchInput = document.getElementById('searchInput');
if (searchInput) searchInput.addEventListener('input', (e) => filterConversations(e.target.value));

const imgInput = document.createElement('input');
imgInput.type = 'file';
imgInput.accept = 'image/*';
imgInput.id = 'imageUploadInput';
imgInput.style.display = 'none';
imgInput.addEventListener('change', handleImageSelect);
document.body.appendChild(imgInput);

renderSidebar();
renderMain();

// 手機版：初始關閉 sidebar
if (window.innerWidth < 768) {
  sidebarOpen = false;
  sidebar.className = 'sidebar closed';
  toggleBtn.className = 'toggle-btn closed';
  toggleBtn.innerHTML = icons.chevronRight;
  const backdrop = document.getElementById('sidebarBackdrop');
  if (backdrop) backdrop.className = 'sidebar-backdrop';
}
  </script>
