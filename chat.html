<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>莉莉絲 — 聊天介面</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Google+Sans+Text:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar toggle -->
    <button id="toggleBtn" class="toggle-btn open" onclick="toggleSidebar()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar open">
      <div class="sidebar-inner">
        <!-- Header -->
        <div class="sidebar-header">
          <div class="brand">
            <div class="brand-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1m6.364 1.636-.707.707M21 12h-1M4 12H3m3.343-5.657-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547Z"/></svg>
            </div>
            <span class="brand-name">莉莉絲</span>
          </div>
        </div>

        <!-- New chat -->
        <div class="new-chat-wrap">
          <button class="btn-new-chat" onclick="newConversation()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8ab4f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>
            新的對話
          </button>
        </div>

        <!-- Search -->
        <div class="search-wrap">
          <div class="search-box">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" placeholder="搜尋對話" />
          </div>
        </div>

        <!-- Conversation list -->
        <nav class="conv-list" id="convList"></nav>

        <!-- Bottom -->
        <div id="portraitContainer" class="portrait-container" style="display:none">
          <img id="portraitImg" src="./images/豆花妹害羞.png" alt="莉莉絲" class="portrait-img" onerror="this.style.display='none'" />
        </div>
        <div class="sidebar-bottom" style="display:flex;flex-direction:row;gap:4px;padding:8px 12px">
          <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" style="flex:1;justify-content:center;gap:6px;padding:8px 6px;border-radius:8px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="themeIcon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <span id="themeLabel" style="font-size:13px">白天</span>
          </button>
          <button class="btn-settings" onclick="openSettings()" style="flex:1;justify-content:center;gap:6px;padding:8px 6px;border-radius:8px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            <span style="font-size:13px">設定</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main-content" id="mainContent"></main>
  </div>

  <!-- Settings panel overlay -->
  <div id="settingsOverlay" class="settings-overlay" onclick="closeSettings(event)">
    <div class="settings-panel" onclick="event.stopPropagation()">
      <div class="settings-header">
        <div class="settings-header-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <h2>個人化設定</h2>
        <button class="settings-close" onclick="closeSettings()">&times;</button>
      </div>
      <div class="settings-body">
        <div class="settings-group">
          <label>Agnes AI API Key</label>
          <input type="password" id="apiKeyInput" placeholder="輸入您的 Agnes AI API Key" />
        </div>
        <div class="settings-group">
          <label>對話模型</label>
          <select id="modelSelect">
            <option value="agnes-2.0-flash">Agnes 2.0 Flash</option>
            <option value="agnes-1.5-flash">Agnes 1.5 Flash</option>
            <option value="agnes-1.5-pro">Agnes 1.5 Pro</option>
          </select>
        </div>
        <div class="settings-group">
          <label>API Base URL</label>
          <input type="text" id="baseUrlInput" placeholder="https://apihub.agnes-ai.com/v1" />
        </div>
        <div class="settings-group">
          <label>模式切換</label>
          <div class="mode-toggle-row">
            <span class="mode-label normal-label">一般模式</span>
            <label class="toggle-switch">
              <input type="checkbox" id="writingModeToggle" onchange="toggleWritingMode()" />
              <span class="toggle-slider"></span>
            </label>
            <span class="mode-label writing-label">寫作模式</span>
          </div>
          <div id="modeBadge" class="mode-badge normal">一般</div>
        </div>
        <div class="settings-group">
          <label>GAS Web App URL（雲端同步）</label>
          <input type="text" id="gasUrlInput" placeholder="https://script.google.com/macros/s/..." />
          <div style="display:flex;gap:8px;margin-top:4px">
            <span id="syncStatus" style="font-size:13px;flex:1;align-self:center"></span>
            <button class="settings-sync-btn" onclick="syncMemoryNow()">同步</button>
          </div>
        </div>
        <button class="settings-save-btn" onclick="saveSettings()">儲存設定</button>
        <div id="settingsStatus" class="settings-status"></div>
      </div>
    </div>
  </div>

  <!-- Import conversation dialog -->
  <div id="importOverlay" class="import-overlay" onclick="closeImport(event)">
    <div class="import-panel" onclick="event.stopPropagation()">
      <div class="import-header">
        <div class="import-header-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        </div>
        <h2>匯入對話紀錄</h2>
        <button class="import-close" onclick="closeImport()">&times;</button>
      </div>
      <div class="import-body">
        <p class="import-desc">從原始莉莉絲網站的瀏覽器 DevTools → Application → Local Storage → <code>lilith_pro_state</code>，複製其 Value 並貼到下方，或直接選擇 JSON 檔案。</p>

        <div class="import-file-row">
          <label class="import-file-label">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            選擇 JSON 檔案
            <input type="file" id="importFileInput" class="import-file-input" accept=".json" onchange="handleImportFile(event)" />
          </label>
          <span class="import-file-hint">或手動貼上</span>
        </div>

        <textarea id="importTextarea" class="import-textarea" rows="8" placeholder='在此貼上 lilith_pro_state 的 JSON 內容…'></textarea>
        <div id="importError" class="import-error"></div>
        <button class="import-btn" onclick="doImport()">匯入對話</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="chat.js"></script>
</body>
</html>
